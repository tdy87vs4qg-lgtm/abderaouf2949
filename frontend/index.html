<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101010" />
    <meta name="description" content="تيسير — منصّتك التعليمية المتكاملة للتفوق في البكالوريا." />
    <link rel="icon" type="image/svg+xml" href="/react/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>تيسير | لأننا نؤمن أن خلف كل تفوقٍ حلمٌ يستحق الدعم</title>
    <script>
      /* Apply the saved (or OS-preferred) theme before paint to avoid a flash
         of the wrong palette. Mirrors ThemeProvider's resolution logic. */
      (function () {
        try {
          var t = localStorage.getItem('taysir-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'light' ? '#f5f5f5' : '#101010');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Instant first-paint shell. This branded loader is part of the static
           HTML, so the visitor sees تيسير + a spinner in ~1s instead of a blank
           brand-colored screen while the JS bundle downloads and React mounts.
           React replaces #root's children on mount (createRoot), so this is
           removed automatically the moment the app is interactive — no JS,
           no extra requests, no layout shift. -->
      <div id="app-boot" aria-hidden="true">
        <div class="app-boot__brand">تيسير</div>
        <div class="app-boot__spinner"></div>
      </div>
      <style>
        /* Matches the app's "Porcelain & Graphite" system exactly, so the
           handoff from this static shell to React is invisible: same bg,
           same San-Francisco-first stack, same neutral ink. Strictly
           achromatic — white / black / gray only. */
        #app-boot{position:fixed;inset:0;display:flex;flex-direction:column;
          align-items:center;justify-content:center;gap:20px;
          background:#101010;z-index:1;
          font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Arabic',
            'Segoe UI','Noto Kufi Arabic','Tajawal',system-ui,sans-serif;
          -webkit-font-smoothing:antialiased}
        html[data-theme="light"] #app-boot{background:#f5f5f5}
        .app-boot__brand{font-size:1.75rem;font-weight:700;letter-spacing:-.022em;
          color:#f5f5f5;
          animation:app-boot-pulse 1.8s cubic-bezier(.4,0,.2,1) infinite}
        html[data-theme="light"] .app-boot__brand{color:#1d1d1d}
        /* A thin, quiet iOS-style indeterminate ring — neutral gray, no tint. */
        .app-boot__spinner{width:26px;height:26px;border-radius:50%;
          border:2px solid rgba(235,235,235,.18);border-top-color:#b4b4b4;
          animation:app-boot-spin .8s linear infinite}
        html[data-theme="light"] .app-boot__spinner{
          border-color:rgba(0,0,0,.1);border-top-color:#4b4b4b}
        @keyframes app-boot-spin{to{transform:rotate(360deg)}}
        @keyframes app-boot-pulse{0%,100%{opacity:.55}50%{opacity:1}}
        @media (prefers-reduced-motion:reduce){
          .app-boot__brand,.app-boot__spinner{animation:none}}
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
